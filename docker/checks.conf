# The checks every request goes through before it is served or forwarded, in this order:
# a path with a raw control character or backslash, then the Host header, then Origin, then Sec-Fetch-Site.
# The maps are in /run/banana/maps.conf (generated) and in nginx.conf.
if ($banana_raw_path_bad) {
  include /run/banana/headers.conf;
  return 400 "bad request\n";
}
if ($banana_host_verdict = redirect) {
  include /run/banana/headers.conf;
  return 308 "$banana_public_origin$request_uri";
}
if ($banana_host_verdict = refuse) {
  include /run/banana/headers.conf;
  return 421 "Misdirected request. Banana answers at $banana_public_origin\n";
}
if ($banana_origin_ok = 0) {
  include /run/banana/headers.conf;
  return 403 "forbidden origin\n";
}
if ($banana_sfs_refused) {
  include /run/banana/headers.conf;
  return 403 "forbidden cross-site request\n";
}
