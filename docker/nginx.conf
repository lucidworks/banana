# The web server configuration. It is fixed; everything that depends on the environment is in the
# files that banana-entrypoint writes into /run/banana, which this file includes.
worker_processes auto;
pid /run/banana/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type text/plain;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 10m;
  absolute_redirect off;
  # Only /run/banana is writable.
  client_body_temp_path /run/banana/tmp/client_body;
  proxy_temp_path /run/banana/tmp/proxy;
  fastcgi_temp_path /run/banana/tmp/fastcgi;
  uwsgi_temp_path /run/banana/tmp/uwsgi;
  scgi_temp_path /run/banana/tmp/scgi;

  # Method, path without the query string, status and time. No cookie, header or query string.
  log_format banana '$time_iso8601 $remote_addr $request_method $uri $status $request_time';
  access_log /dev/stdout banana;

  include /run/banana/http-extra.conf;
  include /run/banana/maps.conf;

  # A raw path (before the query string) that holds a backslash, a NUL or another control character.
  map $request_uri $banana_raw_path_bad {
    default 0;
    "~^[^?]*[\x5c\x00-\x1f\x7f]" 1;
  }

  # Sec-Fetch-Site: under /api/, cross-site and same-site are refused for every method; elsewhere
  # a cross-site request that is not GET or HEAD is refused.
  map "$http_sec_fetch_site|$request_method|$uri" $banana_sfs_refused {
    default 0;
    "~*^(cross-site|same-site)\|[A-Za-z]+\|/api/" 1;
    "~*^cross-site\|(?!(GET|HEAD)\|)" 1;
  }

  server {
    listen 8080 default_server;
    server_name _;
    include /run/banana/server.conf;

    # What nginx itself answers (no such file, an upstream that is down, an oversize body) carries the
    # same headers as the rest of the container's own answers.
    error_page 400 /_banana_error_400;
    error_page 403 /_banana_error_403;
    error_page 404 /_banana_error_404;
    error_page 405 /_banana_error_405;
    error_page 413 /_banana_error_413;
    error_page 414 /_banana_error_414;
    error_page 431 /_banana_error_431;
    error_page 500 /_banana_error_500;
    error_page 502 /_banana_error_502;
    error_page 503 /_banana_error_503;
    error_page 504 /_banana_error_504;
    location = /_banana_error_400 { internal; include /run/banana/headers.conf; return 400 "bad request\n"; }
    location = /_banana_error_403 { internal; include /run/banana/headers.conf; return 403 "forbidden\n"; }
    location = /_banana_error_404 { internal; include /run/banana/headers.conf; return 404 "not found\n"; }
    location = /_banana_error_405 { internal; include /run/banana/headers.conf; return 405 "method not allowed\n"; }
    location = /_banana_error_413 { internal; include /run/banana/headers.conf; return 413 "request body too large\n"; }
    location = /_banana_error_414 { internal; include /run/banana/headers.conf; return 414 "request address too long\n"; }
    location = /_banana_error_431 { internal; include /run/banana/headers.conf; return 431 "request headers too large\n"; }
    location = /_banana_error_500 { internal; include /run/banana/headers.conf; return 500 "internal error\n"; }
    location = /_banana_error_502 { internal; include /run/banana/headers.conf; return 502 "Fusion did not answer\n"; }
    location = /_banana_error_503 { internal; include /run/banana/headers.conf; return 503 "unavailable\n"; }
    location = /_banana_error_504 { internal; include /run/banana/headers.conf; return 504 "Fusion did not answer in time\n"; }

    # The container only. Not subject to the Host check, so an orchestrator can probe it.
    location = /healthz {
      include /usr/local/lib/banana/methods.conf;
      include /run/banana/headers.conf;
      add_header Cache-Control "no-store" always;
      return 200 "ok\n";
    }

    # The rendered configuration. It is never read from the static files.
    location = /config.js {
      include /usr/local/lib/banana/checks.conf;
      include /usr/local/lib/banana/methods.conf;
      include /run/banana/headers.conf;
      add_header Cache-Control "no-cache" always;
      alias /run/banana/config.root.js;
    }

    # The mount at /admin/banana/, the admin UI route and /healthz/upstream depend on switches.
    include /run/banana/locations.conf;

    # Fusion's API and login page, forwarded as the browser sent them.
    location = /api {
      include /usr/local/lib/banana/checks.conf;
      include /usr/local/lib/banana/methods.conf;
      include /run/banana/proxy-headers.conf;
      include /run/banana/proxy.conf;
    }
    location /api/ {
      include /usr/local/lib/banana/checks.conf;
      include /run/banana/proxy-headers.conf;
      include /run/banana/proxy.conf;
    }
    location /auth/ {
      include /usr/local/lib/banana/checks.conf;
      include /run/banana/proxy-headers.conf;
      include /run/banana/proxy.conf;
    }

    # Gateway and Solr routes Banana does not use are not forwarded.
    location = /api-ws { include /usr/local/lib/banana/not-found.conf; }
    location ^~ /api-ws/ { include /usr/local/lib/banana/not-found.conf; }
    location = /solr { include /usr/local/lib/banana/not-found.conf; }
    location ^~ /solr/ { include /usr/local/lib/banana/not-found.conf; }
    location = /oauth2 { include /usr/local/lib/banana/not-found.conf; }
    location ^~ /oauth2/ { include /usr/local/lib/banana/not-found.conf; }
    location = /actuator { include /usr/local/lib/banana/not-found.conf; }
    location ^~ /actuator/ { include /usr/local/lib/banana/not-found.conf; }

    # Banana's files.
    location / {
      include /usr/local/lib/banana/checks.conf;
      include /run/banana/headers.conf;
      add_header Cache-Control "no-cache" always;
      root /usr/share/banana/www;
      index index.html;
      etag on;
    }
  }
}
